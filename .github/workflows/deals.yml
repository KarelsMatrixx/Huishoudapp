name: Marktplaats deals

on:
  schedule:
    - cron: "17 6 * * *"   # elke dag rond 07:17 of 08:17 Nederlandse tijd
  workflow_dispatch:

jobs:
  zoeken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/deals.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
