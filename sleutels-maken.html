<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meldingssleutels maken</title>
<style>
  body { margin: 0; padding: 32px 20px; background: #EDF0EA; color: #16241F;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .kader { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #5C6B64; font-size: 15px; line-height: 1.5; }
  button { background: #16241F; color: #fff; border: 0; border-radius: 999px;
           padding: 14px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .kaart { background: #fff; border: 1px solid #DCE2D9; border-radius: 16px; padding: 16px; margin-top: 16px; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #5C6B64; }
  .waarde { font-family: ui-monospace, "Consolas", monospace; font-size: 13px; word-break: break-all;
            background: #EDF0EA; border-radius: 10px; padding: 10px; margin-top: 6px; }
  .geheim { border-color: #B4436C; }
  .waarschuwing { background: #E8B33D; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 6px; }
  .fout { background: #F7E4E9; border-radius: 10px; padding: 12px; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="kader">
  <h1>Meldingssleutels maken</h1>
  <p>Deze pagina maakt twee sleutels aan die nodig zijn om pushmeldingen te versturen.
     Alles gebeurt in je eigen browser, er gaat niets naar internet.</p>

  <button id="maak">Sleutels aanmaken</button>
  <div id="uitkomst"></div>
</div>

<script>
const naarB64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

document.getElementById("maak").addEventListener("click", async () => {
  const doel = document.getElementById("uitkomst");
  try {
    if (!window.crypto || !window.crypto.subtle) throw new Error("geen-crypto");

    const paar = await crypto.subtle.generateKey(
      { name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]
    );
    const publiek = naarB64(await crypto.subtle.exportKey("raw", paar.publicKey));
    const jwk = await crypto.subtle.exportKey("jwk", paar.privateKey);
    const prive = jwk.d;

    doel.innerHTML = `
      <div class="kaart">
        <div class="label">publieke sleutel</div>
        <div class="waarde">${publiek}</div>
        <p style="margin-bottom:0">Deze komt in het bestand <strong>src/config.js</strong>
           bij <strong>vapidPublicKey</strong>. Mag openbaar zijn.</p>
      </div>
      <div class="kaart geheim">
        <div class="label">prive sleutel</div>
        <div class="waarde">${prive}</div>
        <div class="waarschuwing">Geheim. Deze gaat straks alleen naar Supabase,
           bij Edge Functions onder Secrets als <strong>VAPID_PRIVATE_KEY</strong>.
           Zet hem nergens anders neer en deel hem met niemand.</div>
      </div>
      <p>Bewaar allebei even in een kladbestand. Sluit deze pagina pas als ze op hun plek staan,
         want ze zijn hierna niet meer terug te halen. Kwijt? Maak gewoon een nieuw paar.</p>`;
  } catch (e) {
    doel.innerHTML = `<div class="fout">Het lukte niet in deze browser
      (${e.message}). Open dit bestand in Chrome of Edge, of laat het weten,
      dan pakken we het anders aan.</div>`;
  }
});
</script>
</body>
</html>
